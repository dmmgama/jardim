<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="1160" height="780" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1160" height="780" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="#141414">Bloco 3 — Nomenclatura, eixos e cantos</text>
  <text x="40" y="64" font-size="12" fill="#6a6a6a">Só convenções. Sem cotas — essas entram no Bloco 4.</text>
  <line x1="40" y1="78" x2="1120" y2="78" stroke="#dcdcdc"/>

  <!-- ============ RECTANGULO ============ -->
  <rect x="190" y="170" width="680" height="314" fill="#2b2b2b"/>
  <rect x="200" y="180" width="660" height="294" fill="#f2f2ef"/>

  <!-- etiquetas dos muros -->
  <text x="162" y="327" font-size="15" font-weight="700" fill="#0b4f8a" text-anchor="middle" transform="rotate(-90 162 327)">MURO NE</text>
  <text x="145" y="327" font-size="10.5" fill="#5a7f9e" text-anchor="middle" transform="rotate(-90 145 327)">fachada · azimute 65°</text>

  <text x="530" y="156" font-size="15" font-weight="700" fill="#0b4f8a" text-anchor="middle">MURO SE</text>
  <text x="530" y="140" font-size="10.5" fill="#5a7f9e" text-anchor="middle">lateral · escadas encostam aqui</text>

  <text x="530" y="510" font-size="15" font-weight="700" fill="#0b4f8a" text-anchor="middle">MURO NW</text>
  <text x="530" y="526" font-size="10.5" fill="#5a7f9e" text-anchor="middle">lateral · lodão encostado aqui</text>

  <text x="898" y="327" font-size="15" font-weight="700" fill="#b03030" text-anchor="middle" transform="rotate(90 898 327)">MURO SW</text>
  <text x="915" y="327" font-size="10.5" fill="#b06a5a" text-anchor="middle" transform="rotate(90 915 327)">muro de suporte · azimute 245°</text>

  <!-- ============ EIXOS ============ -->
  <!-- eixo X sobre a face interior do muro NW -->
  <line x1="200" y1="474" x2="930" y2="474" stroke="#1a7a4a" stroke-width="4"/>
  <polygon points="944,474 924,465 924,483" fill="#1a7a4a"/>
  <text x="952" y="479" font-size="19" font-weight="700" fill="#1a7a4a">X</text>
  <text x="600" y="466" font-size="12.5" font-weight="700" fill="#1a7a4a">cresce  NE → SW</text>

  <!-- eixo Y sobre a face interior do muro NE -->
  <line x1="200" y1="474" x2="200" y2="122" stroke="#8a4ba8" stroke-width="4"/>
  <polygon points="200,108 191,128 209,128" fill="#8a4ba8"/>
  <text x="192" y="98" font-size="19" font-weight="700" fill="#8a4ba8">Y</text>
  <text x="220" y="404" font-size="12.5" font-weight="700" fill="#8a4ba8" transform="rotate(-90 220 404)">cresce  NW → SE</text>

  <!-- origem -->
  <circle cx="200" cy="474" r="8" fill="#d06a00"/>
  <circle cx="200" cy="474" r="14" fill="none" stroke="#d06a00" stroke-width="2"/>
  <text x="148" y="500" font-size="13" font-weight="700" fill="#b05500">(0 , 0)</text>
  <text x="112" y="516" font-size="10.5" fill="#b05500">origem no canto N</text>

  <!-- ============ CANTOS ============ -->
  <g>
    <circle cx="200" cy="180" r="10" fill="#0b4f8a"/>
    <text x="200" y="184" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">E</text>
    <text x="222" y="205" font-size="11" fill="#0b4f8a">canto E — chegada das escadas</text>

    <circle cx="200" cy="474" r="10" fill="#0b4f8a"/>
    <text x="200" y="478" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">N</text>
    <text x="222" y="455" font-size="11" fill="#0b4f8a">canto N — árvore decídua · ORIGEM</text>

    <circle cx="860" cy="180" r="10" fill="#0b4f8a"/>
    <text x="860" y="184" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S</text>
    <text x="838" y="205" font-size="11" fill="#0b4f8a" text-anchor="end">canto S</text>

    <circle cx="860" cy="474" r="10" fill="#0b4f8a"/>
    <text x="860" y="478" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">W</text>
    <text x="838" y="455" font-size="11" fill="#0b4f8a" text-anchor="end">canto W</text>
  </g>

  <!-- ============ PONTO EXEMPLO ============ -->
  <line x1="731" y1="474" x2="731" y2="312" stroke="#8a4ba8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="200" y1="312" x2="731" y2="312" stroke="#1a7a4a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <circle cx="731" cy="312" r="7" fill="#d06a00"/>
  <text x="746" y="306" font-size="13" font-weight="700" fill="#b05500">( 10.46 , 3.18 )</text>
  <text x="746" y="322" font-size="10.5" fill="#b05500">10.46 m do muro NE</text>
  <text x="746" y="336" font-size="10.5" fill="#b05500">3.18 m do muro NW</text>
  <text x="746" y="352" font-size="10" fill="#8a8a8a">valores de exemplo</text>

  <!-- nota -->
  <line x1="190" y1="556" x2="200" y2="556" stroke="#2b2b2b" stroke-width="6"/>
  <text x="212" y="560" font-size="11" fill="#555">Eixos assentes nas FACES INTERIORES dos muros, não nos seus eixos.</text>

  <!-- ============ ROSA DOS VENTOS ============ -->
  <g transform="translate(1035,300)">
    <circle cx="0" cy="0" r="76" fill="#fbfbf9" stroke="#ccc" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-47" y2="47" stroke="#c0392b" stroke-width="3.2"/>
    <polygon points="-49,49 -62,54 -54,41" fill="#c0392b"/>
    <text x="-69" y="71" font-size="16" font-weight="700" fill="#c0392b">N</text>
    <line x1="0" y1="0" x2="47" y2="-47" stroke="#aaa" stroke-width="1.6"/><text x="52" y="-50" font-size="12" fill="#888">S</text>
    <line x1="0" y1="0" x2="-47" y2="-47" stroke="#aaa" stroke-width="1.6"/><text x="-63" y="-50" font-size="12" fill="#888">E</text>
    <line x1="0" y1="0" x2="47" y2="47" stroke="#aaa" stroke-width="1.6"/><text x="52" y="63" font-size="12" fill="#888">W</text>
    <line x1="0" y1="0" x2="-68" y2="0" stroke="#0b4f8a" stroke-width="2.6" stroke-dasharray="4 3"/><text x="-95" y="5" font-size="13" font-weight="700" fill="#0b4f8a">NE</text>
    <line x1="0" y1="0" x2="68" y2="0" stroke="#b03030" stroke-width="2.6" stroke-dasharray="4 3"/><text x="75" y="5" font-size="13" font-weight="700" fill="#b03030">SW</text>
    <line x1="0" y1="0" x2="0" y2="-68" stroke="#0b4f8a" stroke-width="2.6" stroke-dasharray="4 3"/><text x="-10" y="-75" font-size="13" font-weight="700" fill="#0b4f8a">SE</text>
    <line x1="0" y1="0" x2="0" y2="68" stroke="#0b4f8a" stroke-width="2.6" stroke-dasharray="4 3"/><text x="-11" y="88" font-size="13" font-weight="700" fill="#0b4f8a">NW</text>
  </g>
  <text x="1035" y="408" font-size="10.5" fill="#666" text-anchor="middle">Planta rodada ~135° face ao norte</text>
  <text x="1035" y="424" font-size="10.5" fill="#666" text-anchor="middle">Eixo longo medido: 65° / 245°</text>

  <!-- ============ TABELAS ============ -->
  <line x1="40" y1="590" x2="1120" y2="590" stroke="#dcdcdc"/>
  <g font-size="12" fill="#333">
    <rect x="40" y="606" width="520" height="20" fill="#eeeeea"/>
    <text x="50" y="620" font-weight="700">Nome oficial</text>
    <text x="190" y="620" font-weight="700">Lado</text>
    <text x="275" y="620" font-weight="700">Papel</text>
    <text x="50" y="644">Muro NE</text><text x="190" y="644">curto</text><text x="275" y="644">Fachada traseira · escadas · entrada</text>
    <text x="50" y="666">Muro SW</text><text x="190" y="666">curto</text><text x="275" y="666">Muro de fundo · muro de suporte</text>
    <text x="50" y="688">Muro SE</text><text x="190" y="688">comprido</text><text x="275" y="688">Lateral · escadas encostam</text>
    <text x="50" y="710">Muro NW</text><text x="190" y="710">comprido</text><text x="275" y="710">Lateral · lodão encostado</text>
    <text x="50" y="740" font-size="11" fill="#666">X = 0 no muro NE  ·  Y = 0 no muro NW  ·  origem no canto N</text>

    <rect x="600" y="606" width="520" height="20" fill="#eeeeea"/>
    <text x="610" y="620" font-weight="700">Proibido</text>
    <text x="790" y="620" font-weight="700">Usar</text>
    <text x="610" y="644">"muro esquerdo"</text><text x="790" y="644">Muro NE ou Muro NW, conforme</text>
    <text x="610" y="666">"muro do fundo"</text><text x="790" y="666">Muro SW</text>
    <text x="610" y="688">"muro traseiro"</text><text x="790" y="688">Muro NE (fachada)</text>
    <text x="610" y="710">"canto do hot tub"</text><text x="790" y="710">Canto N</text>
  </g>
</svg>
